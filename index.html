<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Horizontal Phone Rotation</title>

<style>
    *{
        box-sizing:border-box;
        margin:0;
        padding:0;
        font-family:Arial,sans-serif;
    }

    body{
        background:#111;
        color:white;
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        text-align:center;
        overflow:hidden;
    }

    .app{
        width:95%;
        max-width:500px;
    }

    h1{
        margin-bottom:20px;
    }

    button{
        padding:14px 24px;
        border:none;
        border-radius:12px;
        background:#00aa88;
        color:white;
        font-size:18px;
        cursor:pointer;
        margin-bottom:20px;
    }

    .angle{
        font-size:72px;
        color:#00ff99;
        font-weight:bold;
        margin:20px 0;
    }

    .direction{
        font-size:24px;
        margin-bottom:25px;
    }

    .phone{
        width:220px;
        height:120px;
        border:6px solid white;
        border-radius:22px;
        margin:30px auto;
        background:#222;
        transition:transform 0.05s linear;
        position:relative;
    }

    .phone::before{
        content:'';
        position:absolute;
        right:10px;
        top:50%;
        transform:translateY(-50%);
        width:6px;
        height:40px;
        border-radius:3px;
        background:#666;
    }

    .barWrap{
        width:100%;
        height:40px;
        background:#333;
        border-radius:20px;
        overflow:hidden;
        position:relative;
        margin-top:30px;
    }

    .center{
        position:absolute;
        left:50%;
        top:0;
        width:2px;
        height:100%;
        background:white;
        z-index:2;
    }

    .bar{
        position:absolute;
        left:50%;
        top:0;
        width:50%;
        height:100%;
        background:linear-gradient(90deg,#00ff99,#00aaff);
        transform-origin:left center;
    }

    .status{
        margin-top:25px;
        color:#aaa;
        line-height:1.5;
    }

</style>
</head>
<body>

<div class="app">

    <h1>Horizontal Rotation</h1>

    <button id="startBtn">Enable Gyroscope</button>

    <div class="angle" id="angle">0°</div>

    <div class="direction" id="direction">
        CENTER
    </div>

    <div class="phone" id="phone"></div>

    <div class="barWrap">
        <div class="center"></div>
        <div class="bar" id="bar"></div>
    </div>

    <div class="status" id="status">
        Hold phone horizontally like watching YouTube.
    </div>

</div>

<script>

const angleEl = document.getElementById('angle');
const directionEl = document.getElementById('direction');
const phoneEl = document.getElementById('phone');
const barEl = document.getElementById('bar');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');

let calibratedOffset = 0;

function clamp(v,min,max){
    return Math.max(min,Math.min(max,v));
}

function updateUI(angle){

    angle = clamp(angle,-90,90);

    angleEl.textContent = angle.toFixed(1) + "°";

    if(angle > 5){
        directionEl.textContent = "RIGHT";
    }
    else if(angle < -5){
        directionEl.textContent = "LEFT";
    }
    else{
        directionEl.textContent = "CENTER";
    }

    // Rotate visual phone
    phoneEl.style.transform =
        `rotate(${angle}deg)`;

    // Bar
    const scale = angle / 90;

    if(scale >= 0){
        barEl.style.transformOrigin = 'left center';
    }else{
        barEl.style.transformOrigin = 'right center';
    }

    barEl.style.transform = `scaleX(${scale})`;
}

function handleOrientation(event){

    /*
        IMPORTANT FIX:

        When phone is horizontal (landscape),
        gamma becomes unreliable for left/right hand rotation.

        beta works much better in landscape mode.

        So:
        - Portrait => gamma
        - Landscape => beta
    */

    let rawAngle = 0;

    const orientation =
        screen.orientation
        ? screen.orientation.angle
        : window.orientation || 0;

    // LANDSCAPE
    if(Math.abs(orientation) === 90){

        // beta works better in landscape
        rawAngle = event.beta || 0;

    }else{

        // portrait
        rawAngle = event.gamma || 0;
    }

    // calibration
    const angle = rawAngle - calibratedOffset;

    updateUI(angle);
}

async function enableGyro(){

    if(
        typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function'
    ){

        try{

            const permission =
                await DeviceOrientationEvent.requestPermission();

            if(permission === 'granted'){

                startListening();

            }else{

                statusEl.textContent =
                    "Permission denied.";

            }

        }catch(err){

            console.error(err);

            statusEl.textContent =
                "Gyroscope permission error.";

        }

    }else{

        startListening();
    }
}

function startListening(){

    statusEl.innerHTML =
        "Gyroscope active.<br>" +
        "Landscape mode supported.";

    startBtn.style.display = 'none';

    // Auto-calibrate initial hand position
    let calibrated = false;

    function calibrateOnce(event){

        const orientation =
            screen.orientation
            ? screen.orientation.angle
            : window.orientation || 0;

        if(Math.abs(orientation) === 90){
            calibratedOffset = event.beta || 0;
        }else{
            calibratedOffset = event.gamma || 0;
        }

        calibrated = true;

        window.removeEventListener(
            'deviceorientation',
            calibrateOnce
        );

        window.addEventListener(
            'deviceorientation',
            handleOrientation
        );
    }

    window.addEventListener(
        'deviceorientation',
        calibrateOnce
    );
}

startBtn.addEventListener('click', enableGyro);

</script>

</body>
</html>
